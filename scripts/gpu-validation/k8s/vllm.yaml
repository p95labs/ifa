---
# vLLM inference pod — GPU-backed, facebook/opt-125m, KV cache constrained
# to make exhaustion reachable under load.
apiVersion: v1
kind: Pod
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
    inference.io/runtime: vllm
  annotations:
    # IFA uses annotations (not labels) for model name because Hugging Face
    # model IDs contain '/' which is illegal in label values.
    inference.io/runtime: vllm
    inference.io/model: facebook/opt-125m
spec:
  restartPolicy: Never
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.28.0
      args:
        - "--model=facebook/opt-125m"
        - "--host=0.0.0.0"
        - "--port=8000"
        - "--dtype=float16"
        - "--gpu-memory-utilization=0.6"
        - "--num-gpu-blocks-override=512"
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          memory: "8Gi"
          cpu: "2"
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 18
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 120
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
    inference.io/runtime: vllm
  annotations:
    inference.io/runtime: vllm
    inference.io/model: facebook/opt-125m
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

# deploy/examples/vllm/deployment.yaml
#
# Minimal vLLM deployment for local Kubernetes validation of IFA.
# Model: facebook/opt-125m  (~250 MB)
#
# Image: vllm/vllm-openai:v0.4.3 — last release with a working CPU backend.
# vllm/vllm-openai:latest is GPU-only and crashes on kind/minikube with no CUDA.
#
# For GPU clusters: change image to vllm/vllm-openai:latest, remove
# --device cpu, change --dtype to auto, and uncomment the resources block.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-example
  namespace: inference
  labels:
    app: vllm-example
    # inference.io/runtime is a LABEL — the value is short, from a fixed set,
    # and useful for label selectors.
    inference.io/runtime: vllm
  annotations:
    # inference.io/model is an ANNOTATION, not a label, because Hugging Face
    # model IDs (e.g. "facebook/opt-125m") contain "/" which is not a valid
    # Kubernetes label value character. Annotations have no such restriction.
    # This annotation is optional; IFA continues to function without it.
    inference.io/model: facebook/opt-125m
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-example
  template:
    metadata:
      labels:
        app: vllm-example
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.4.3
          args:
            - "--model"
            - "facebook/opt-125m"
            - "--port"
            - "8000"
            - "--host"
            - "0.0.0.0"
            - "--device"
            - "cpu"
            - "--dtype"
            - "float32"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HF_HOME
              value: /tmp/hf_cache
          # Uncomment for GPU clusters:
          # resources:
          #   limits:
          #     nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf_cache
      volumes:
        - name: hf-cache
          emptyDir: {}
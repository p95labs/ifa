{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ifa.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ifa.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# IFA never calls the Kubernetes API on behalf of a request, so it has no use
# for a projected token beyond its own discovery client.
automountServiceAccountToken: true
{{- end }}

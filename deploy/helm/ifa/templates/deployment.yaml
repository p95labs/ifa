apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ifa.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ifa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # IFA holds telemetry in memory, so a rolling update starts a replica with an
  # empty store. Recreate keeps two instances from reporting different findings
  # for the same workload during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ifa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the configuration changes. Without this a
        # `helm upgrade` that only edits thresholds updates the ConfigMap and
        # leaves the running process on the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ifa.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ifa.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: {{ include "ifa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/ifa/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: IFA_LOG_LEVEL
              value: {{ .Values.config.logging.level | quote }}
            - name: IFA_CLUSTER_NAME
              value: {{ .Values.config.cluster_name | quote }}
            {{- if .Values.database.existingSecret }}
            # Kept out of the ConfigMap: the DSN carries a password.
            - name: IFA_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            {{- end }}
            {{- if .Values.alerting.existingSecret }}
            # Kept out of the ConfigMap: the URL carries the webhook token.
            - name: IFA_ALERTING_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alerting.existingSecret }}
                  key: {{ .Values.alerting.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/ifa
              readOnly: true
            # readOnlyRootFilesystem is on, so anything that needs to write —
            # the Go runtime's temporary files, for instance — needs somewhere
            # to go.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "ifa.fullname" . }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

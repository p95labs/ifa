{{- if .Values.networkPolicy.enabled }}
# Default-deny for IFA's own pod, with holes only where it genuinely needs them.
#
# The important detail: IFA scrapes the inference runtimes directly, on their
# own metrics ports. It does not go through Prometheus. A policy that allows
# egress only to Prometheus and the API server — the obvious first draft — makes
# every target unreachable and turns the whole fleet into "telemetry is stale"
# findings. List the namespaces and ports of the workloads being watched under
# networkPolicy.scrapeNamespaces / scrapePorts.
#
# Enforcement requires a CNI that implements NetworkPolicy (Calico, Cilium,
# Antrea). Flannel accepts the object and does not enforce it, which looks
# identical to a working policy from kubectl. Verify with a connectivity test.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ifa.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ifa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ifa.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The API and the metrics endpoint. Everything IFA serves is read-only, but
    # it is unauthenticated, so who can reach it is the only access control
    # there is — see docs/SECURITY_MODEL.md.
    {{- with .Values.networkPolicy.ingressNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  egress:
    # DNS. Without this every scrape fails on name resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server, for workload discovery. 443 and 6443 cover the
    # common cases; clusters with an out-of-cluster API server may need an
    # explicit ipBlock instead.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- if .Values.networkPolicy.scrapeNamespaces }}
    # The inference runtimes themselves.
    - to:
        {{- range .Values.networkPolicy.scrapeNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.scrapePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.dcgmNamespaces }}
    # DCGM Exporter, the only source of real GPU utilisation.
    - to:
        {{- range .Values.networkPolicy.dcgmNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.dcgmPort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.databaseNamespace }}
    # Optional TimescaleDB history backend.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }}
      ports:
        - port: {{ .Values.networkPolicy.databasePort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.config.alerting.enabled }}
    # Webhook endpoint for alert delivery. Slack, Teams and PagerDuty are all
    # external services, so the full external address space is needed — there
    # is no namespace selector that narrows this further.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
    {{- end }}
{{- end }}

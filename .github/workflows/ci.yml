name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch: a PR pushed three times in a minute does
# not need three full builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The `go` directive in go.mod is the language floor (1.26). This is the
  # toolchain CI builds and scans with, and it is deliberately higher: standard
  # library vulnerabilities are fixed in toolchain patch releases, so pinning
  # the floor here would make the vulnerability scan fail for something no
  # dependency bump can fix. Tracking the latest 1.27 patch picks those up.
  GO_VERSION: "1.27"
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Formatting
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted=$(gofmt -l -s "${go_files[@]}")
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector matters here: the collector scrapes targets
      # concurrently and the telemetry store is read by HTTP handlers while the
      # collector writes to it.
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The demo is the first thing anyone evaluating this project runs. If it
      # stops working, that should break the build rather than someone's
      # first impression.
      - name: Run the demo end to end
        run: |
          make build
          IFA_DEMO_SETTLE=12 timeout 90 ./scripts/demo.sh > demo.log 2>&1 &
          demo_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS localhost:8080/api/v1/readyz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sleep 15
          findings=$(curl -fsS localhost:8080/api/v1/recommendations | jq '.count')
          echo "demo produced $findings finding(s)"
          test "$findings" -ge 5
          curl -fsS localhost:8080/metrics | grep -q '^ifa_scrapes_total'
          kill $demo_pid 2>/dev/null || true

      - name: Show demo output on failure
        if: failure()
        run: cat demo.log || true

  lint-charts:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Lint
        run: helm lint deploy/helm/ifa

      - name: Render with defaults
        run: helm template ifa deploy/helm/ifa > /dev/null

      - name: Render with every optional feature enabled
        run: |
          helm template ifa deploy/helm/ifa \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set serviceMonitor.enabled=true \
            --set replicaCount=2 \
            --set rbac.scope=cluster \
            --set database.existingSecret=ifa-db > /dev/null

      # Catches a manifest that renders but that the API server would reject.
      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          helm template ifa deploy/helm/ifa \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
          | /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -ignore-missing-schemas -

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: ifa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is distroless with no shell, so the only meaningful smoke
      # test is that the entrypoint runs and reports its version.
      - name: Smoke test
        run: docker run --rm ifa:ci -version

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: |
          curl -sSLo /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - run: shellcheck scripts/*.sh

  kind-integration:
    name: Kind integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the IFA image and make it available to the local Docker daemon so
      # that `kind load docker-image` can pull it out of the daemon cache.
      - name: Build IFA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: ifa:integration-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kind
        run: |
          sudo curl -sSLo /usr/local/bin/kind \
            "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          kind version

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Run integration test
        run: bash scripts/kind-integration.sh

      # Both failure steps are guarded so they only add noise when something
      # actually went wrong; on success the job completes cleanly.
      - name: IFA pod logs on failure
        if: failure()
        run: |
          kubectl logs --namespace ifa \
            -l app.kubernetes.io/name=ifa --tail=100 2>/dev/null || true

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all --all-namespaces 2>/dev/null || true
          kubectl describe pods --all-namespaces 2>/dev/null || true

  kind-dynamic-integration:
    name: Kind dynamic integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the IFA image. We share the GHA cache key with the static
      # integration test job so a back-to-back push benefits from the warm cache.
      - name: Build IFA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: ifa:integration-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build the dynserver image. It is a separate binary so a change to one
      # does not force a rebuild of the other.
      - name: Build dynserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.dynserver
          push: false
          load: true
          tags: dynserver:integration-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kind
        run: |
          sudo curl -sSLo /usr/local/bin/kind \
            "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          kind version

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Run dynamic integration test
        run: |
          IFA_IMAGE=ifa:integration-test \
          DYNSERVER_IMAGE=dynserver:integration-test \
          bash scripts/kind-dynamic-integration.sh

      - name: IFA pod logs on failure
        if: failure()
        run: |
          kubectl logs --namespace ifa \
            -l app.kubernetes.io/name=ifa --tail=100 2>/dev/null || true

      - name: dynserver logs on failure
        if: failure()
        run: |
          kubectl logs --namespace integration \
            -l app=dynserver --tail=80 2>/dev/null || true

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all --all-namespaces 2>/dev/null || true
          kubectl describe pods --all-namespaces 2>/dev/null || true

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # govulncheck reports only vulnerabilities in code paths that are
      # actually reachable, so a finding here is worth acting on rather than
      # noise from an unused transitive dependency.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  timescaledb-integration:
    name: TimescaleDB integration
    runs-on: ubuntu-latest
    # Image: timescale/timescaledb:2.14.2-pg16
    # PostgreSQL: 16.2   TimescaleDB: 2.14.2
    # No paid infrastructure, no external secrets.
    services:
      timescaledb:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_DB: ifa_test
          POSTGRES_USER: ifa_test
          POSTGRES_PASSWORD: ifa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifa_test -d ifa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Apply the migration before running any tests. IFA never runs migrations
      # itself; this mirrors the operator workflow documented in DEPLOYMENT.md.
      - name: Apply migration
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql "postgres://ifa_test:ifa_test@localhost:5432/ifa_test?sslmode=disable" \
            -f migrations/001_init.sql
          echo "Migration applied"

      # Verify the schema before the Go tests run. Failures here catch a schema
      # drift between the migration and the insert statement before spending time
      # on the full test suite.
      - name: Verify schema (hypertable, columns, index)
        run: |
          HYPER=$(psql "postgres://ifa_test:ifa_test@localhost:5432/ifa_test?sslmode=disable" \
            -tA -c "SELECT count(*) FROM timescaledb_information.hypertables WHERE hypertable_name='telemetry_snapshots'")
          [ "${HYPER}" = "1" ] || { echo "hypertable not created (count=${HYPER})"; exit 1; }
          echo "✓ telemetry_snapshots is a hypertable"

          IDX=$(psql "postgres://ifa_test:ifa_test@localhost:5432/ifa_test?sslmode=disable" \
            -tA -c "SELECT count(*) FROM pg_indexes WHERE tablename='telemetry_snapshots' AND indexname='idx_telemetry_workload'")
          [ "${IDX}" = "1" ] || { echo "idx_telemetry_workload missing (count=${IDX})"; exit 1; }
          echo "✓ idx_telemetry_workload exists"

          COLS=$(psql "postgres://ifa_test:ifa_test@localhost:5432/ifa_test?sslmode=disable" \
            -tA -c "SELECT count(*) FROM information_schema.columns WHERE table_name='telemetry_snapshots'")
          [ "${COLS}" -ge 28 ] || { echo "expected ≥28 columns, got ${COLS}"; exit 1; }
          echo "✓ ${COLS} columns present (expected ≥28)"

      # Run the full integration-tagged test suite, including:
      #   • Migration idempotency
      #   • Persistence of all 28 columns
      #   • NULL vs zero semantics
      #   • Multiple workloads and timestamps
      #   • Reconnect retention
      #   • Store→sink→database pipeline
      #   • Outage: startup failure, failed-write counting, queue-bounded
      #   • Container-stop outage (Docker is available on ubuntu-latest)
      #   • In-memory store unaffected by database failure
      #   • Queue saturation and graceful shutdown
      - name: Run TimescaleDB integration tests
        env:
          TIMESCALE_TEST_DSN: postgres://ifa_test:ifa_test@localhost:5432/ifa_test?sslmode=disable
        run: |
          go test -tags integration -race -count=1 -v \
            -timeout 180s \
            ./internal/storage/timescale/...

      # Verify the Helm chart does not leak the DSN into the ConfigMap when
      # database.existingSecret is set. The DSN is injected via secretKeyRef
      # instead.
      - name: Verify Helm Secret wiring (DSN not in ConfigMap)
        run: |
          curl -sSLo /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 755 /tmp/linux-amd64/helm /usr/local/bin/helm

          CONFIGMAP=$(helm template ifa deploy/helm/ifa \
            --set database.existingSecret=ifa-db \
            --set config.database.enabled=true \
            | awk '/kind: ConfigMap/{found=1} found{print; if(/^---/)exit}')

          if echo "${CONFIGMAP}" | grep -qE 'postgres://'; then
            echo "FAIL: ConfigMap contains a postgres:// DSN"
            exit 1
          fi
          if echo "${CONFIGMAP}" | grep -qE 'dsn:\s+"[^"]'; then
            echo "FAIL: ConfigMap database.dsn has a non-empty value"
            exit 1
          fi
          echo "✓ ConfigMap has no populated postgres:// DSN"

          DEPLOY=$(helm template ifa deploy/helm/ifa \
            --set database.existingSecret=ifa-db \
            --set config.database.enabled=true \
            | awk '/kind: Deployment/{found=1} found{print; if(/^---/)exit}')
          if ! echo "${DEPLOY}" | grep -q "secretKeyRef"; then
            echo "FAIL: Deployment does not use secretKeyRef for IFA_DATABASE_DSN"
            exit 1
          fi
          echo "✓ Deployment uses secretKeyRef for IFA_DATABASE_DSN"

      - name: TimescaleDB and PostgreSQL versions
        if: always()
        run: |
          psql "postgres://ifa_test:ifa_test@localhost:5432/ifa_test?sslmode=disable" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname='timescaledb';" \
            -c "SHOW server_version;"

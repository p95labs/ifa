name: Release

on:
  push:
    tags: ["v*"]

# Default to least-privilege. The sign job overrides id-token: write for
# itself only — no other job can request an OIDC token.
permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Kept in step with ci.yml's GO_VERSION: the released binaries embed the
      # standard library they were built with, so this is what determines
      # whether a published artifact carries a known net/http or crypto/tls fix.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # Cross-compiled by hand rather than with a release framework: two
      # binaries and four platforms do not need one, and a tool that is not
      # used often enough to keep working is worse than a loop.
      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            for cmd in control-plane ifa; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath -ldflags "-s -w -X main.version=${version}" \
                -o "dist/${cmd}" "./cmd/${cmd}"
            done
            tar -czf "dist/ifa_${version}_${os}_${arch}.tar.gz" -C dist control-plane ifa
            rm dist/control-plane dist/ifa
          done
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS )

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  image:
    name: Container image
    runs-on: ubuntu-latest
    # Expose the immutable digest so the sign job can reference it without
    # relying on mutable tags.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sign:
    name: Sign image and generate SBOM
    needs: image
    runs-on: ubuntu-latest
    # id-token: write is needed only for Cosign keyless OIDC signing.
    # It is scoped to this job alone; no other job can request an OIDC token.
    # packages: write is needed to push the signature and SBOM attestation.
    permissions:
      id-token: write
      packages: write
    env:
      IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install Cosign. Keyless signing uses a short-lived GitHub OIDC
      # certificate — no private key is stored anywhere.
      - uses: sigstore/cosign-installer@v3.8.2

      # Sign the immutable digest. The signature is pushed to the OCI registry
      # alongside the image and references the digest, not a mutable tag.
      # Verification: cosign verify --certificate-identity-regexp '...' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   ghcr.io/p95labs/ifa@<digest>
      - name: Sign image digest (keyless)
        run: |
          cosign sign --yes "${IMAGE_REF}"
          echo "Signed: ${IMAGE_REF}"

      # Generate a Syft SBOM in SPDX JSON format for the published image.
      # The SBOM is produced from the actual registry image so it reflects
      # every layer that was pushed, not only the build context.
      - uses: anchore/sbom-action@v0.18.0
        id: sbom
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # Attest the SBOM to the image so it can be retrieved with:
      #   cosign verify-attestation --type spdxjson \
      #     --certificate-identity-regexp '...' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/p95labs/ifa@<digest>
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE_REF}"
          echo "SBOM attested: ${IMAGE_REF}"

      # Upload the SBOM as a release asset so it is downloadable without
      # Cosign tooling.
      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" sbom.spdx.json \
            --clobber \
            --repo "${{ github.repository }}"

      # Print the identity the signature was issued under so the release log
      # records which workflow run produced it.
      - name: Log signing identity
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/release.yml" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}" \
          | jq -r '.[0].optional | {Issuer, Subject, "GitHub workflow": .Workflow, "Run ID": .RunID}'
